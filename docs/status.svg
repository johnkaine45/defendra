<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" role="img" aria-label="sudo defendra status — порядок">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101826"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
  </defs>
  <rect width="880" height="420" rx="16" fill="#1c2333"/>
  <rect x="10" y="10" width="860" height="400" rx="12" fill="url(#bg)"/>
  <circle cx="36" cy="36" r="6" fill="#ff5f57"/>
  <circle cx="56" cy="36" r="6" fill="#febc2e"/>
  <circle cx="76" cy="36" r="6" fill="#28c840"/>
  <text x="110" y="41" fill="#8b9bb4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">admin@vds — sudo defendra status</text>
  <text x="36" y="92" fill="#34d399" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700">Defendra • порядок</text>
  <text x="36" y="136" fill="#d7e0ea" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">Вход           по ключу, пользователь admin</text>
  <text x="36" y="164" fill="#d7e0ea" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">Фильтр         включён, снаружи: 22, 80, 443</text>
  <text x="36" y="192" fill="#d7e0ea" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">Подбор пароля  сегодня отбито 0 попыток</text>
  <text x="36" y="220" fill="#d7e0ea" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">Обновления     ставятся сами</text>
  <text x="36" y="248" fill="#d7e0ea" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">Базы           из интернета не видны</text>
  <text x="36" y="292" fill="#8b9bb4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">DDoS канала    это не Defendra. В панели VDS — хостер.</text>
  <text x="36" y="340" fill="#9ae6b4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">Как заходить:  ssh admin@203.0.113.10</text>
  <text x="36" y="368" fill="#8b9bb4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">Справка:       defendra help</text>
</svg>
