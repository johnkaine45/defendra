name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: go test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: go test ./...

  build:
    name: linux binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o /tmp/defendra-amd64 ./cmd/defendra
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o /tmp/defendra-arm64 ./cmd/defendra
